name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      approval_path:
        description: "Committed release approval under release/evidence/"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /ai-life-simulator/
      VITE_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      VITE_DEEPSEEK_MODEL: deepseek-v4-flash
      VITE_DEEPSEEK_BASE_URL: https://api.deepseek.com
      VITE_FINANCIAL_NODE_GATE_MODE: enforced
      VITE_EXPENSE_LIFECYCLE_MODE: enforced
      VITE_ENABLE_CANDIDATE_PATCH_REPAIR: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify certified runtime fingerprint
        env:
          APPROVAL_PATH: ${{ inputs.approval_path }}
        run: pnpm release:verify-approval -- --approval "$APPROVAL_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: pnpm build

      - name: Prepare static site
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
